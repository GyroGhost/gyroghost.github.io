<style>
  :root{
    --bg:#0b0b0f; --card:#15151c; --card-hover:#1d1d26;
    --line:#2a2a35; --text:#f2f2f5; --muted:#9a9aa8; --red:#e5262f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;background:var(--bg);color:var(--text);
    font-family:"Cairo","Inter",system-ui,sans-serif;
    display:flex;justify-content:center;padding:48px 16px 32px;
    background-image:radial-gradient(circle at 50% -10%,rgba(229,38,47,.18),transparent 55%);
  }
  main{width:100%;max-width:440px;text-align:center}
  .logo{width:132px;height:132px;margin:0 auto 18px;display:block}
  .ring{fill:none;stroke-width:3}
  .spin{transform-origin:60px 60px;animation:spin 14s linear infinite}
  .spin2{transform-origin:60px 60px;animation:spin 20s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin,.spin2{animation:none}}
  h1{font-family:"Inter",sans-serif;font-weight:800;font-size:30px;letter-spacing:.5px}
  h1 span{color:var(--red)}
  .name{color:var(--muted);font-size:15px;margin-top:2px;font-family:"Inter",sans-serif}
  .bio{margin:16px 0 6px;font-size:14px;color:#c9c9d3;line-height:1.8;font-family:"Inter",sans-serif}
  .bio-ar{font-size:15px;color:#c9c9d3}
  .links{display:flex;flex-direction:column;gap:12px;margin-top:28px}
  a.btn{
    display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--text);
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px 16px;transition:.2s;direction:ltr;
  }
  a.btn:hover,a.btn:focus-visible{background:var(--card-hover);border-color:var(--red);transform:translateY(-2px)}
  .icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
  .icon svg{width:24px;height:24px;fill:#fff}
  .txt{flex:1;text-align:left;font-family:"Inter",sans-serif}
  .txt b{display:block;font-size:16px}
  .txt small{display:block;color:var(--muted);font-size:13px;font-family:"Cairo",sans-serif;direction:rtl;text-align:left}
  .arrow{color:var(--muted);font-size:18px}
  .dc{background:#5865F2}.yt{background:#FF0000}
  .ig{background:linear-gradient(45deg,#f9a825,#e1306c,#833ab4)}.gh{background:#24292f;border:1px solid #444}
  .bl{background:#FF5722}.tt{background:#000;border:1px solid #444}
  .socials{display:flex;justify-content:center;gap:14px;margin-top:26px}
  .socials a{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;transition:.2s}
  .socials a:hover,.socials a:focus-visible{transform:translateY(-2px);box-shadow:0 0 0 2px var(--red)}
  .socials svg{width:24px;height:24px;fill:#fff}
  footer{margin-top:36px;color:#5d5d6a;font-size:12px;font-family:"Inter",sans-serif}
</style>
